<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mercado preso</title>
</head>
<body>
    <header>
        <div class="div-header">
            <img class="img-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6KbUzEnJVvD4NZPsEifMnojrUhFRjAuNSMuWMmjGfFA&s" alt="Logo do Mercado Preso">
            <h1 class="titulo-logo">Mercado preso</h1>  
            <input type="text" class="barra-pesquisa" id="barra-de-pesquisa" placeholder="Buscar produtos, marcas e muito mais...">
        </div>
    </header>
    <main>
        <div class="banner-ofertas">
            <img src="https://placehold.co/1280x500" alt="Banner das promoções" class="img-banner">
        </div>
        <div class="lista-produtos">
            <a href="produto1.html" class="produto-link">
                <div class="produto">
                    <img class="img-produto" src="https://placehold.co/250x250" alt="Produto numero um">
                    <h3>Produto 1</h3>
                    <h4>R$9,90</h4>
                </div>
            </a>
            <div class="produto">
                <img class="img-produto" src="https://placehold.co/250x250" alt="Produto numero dois">
                <h3>Produto 2</h3>
                <h4>R$29,98</h4>
            </div>
            <div class="produto">
                <img class="img-produto" src="https://placehold.co/250x250" alt="Produto numero três">
                <h3>Produto 3</h3>
                <h4>R$34,90</h4>
            </div>
            <div class="produto">
                <img class="img-produto" src="https://placehold.co/250x250" alt="Produto numero quatro">
                <h3>Produto 4</h3>
                <h4>R$15,99</h4>
            </div>
        </div>
    </main>
    <footer>
        <div class="div-footer">
            <div class="footer-contato">
                <h4 class="entre-em-contato">Entre em contato</h4>
                <input type="text" id="contato-nome" placeholder=" Insira seu nome...">
                <input type="email" id="contato-email" placeholder=" Insira seu email...">
                <textarea placeholder="Escreva uma mensagem..." id="contato-mensagem"></textarea>
                <button>Enviar</button>
            </div>
            <div class="footer-centro">
                <h4 class="entre-em-contato">Ajuda e políticas</h4>
                <p>Perguntas frequentes</p>
                <p>Termos e condições</p>
                <p>Política de privacidade</p>
                <p>Trocas e devoluções</p>
                <p>Fale conosco</p>
            </div>
            
            <div class="footer-direita">
                <h4 class="entre-em-contato">Sobre nós</h4>
                <p>Quem somos</p>
                <p>Nossa história</p>
                <p>Trabalhe conosco</p>
                <p>E-mail</p>
            </div>
        </div>
    </footer>
</body>
</html>
